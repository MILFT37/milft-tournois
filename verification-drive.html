<!doctype html><html lang="fr"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>MILFT Tournois — vérification Drive</title><style>body{font:16px system-ui;background:#f5f7fb;color:#18304b;max-width:620px;margin:30px auto;padding:20px}main{background:white;border-radius:18px;padding:24px;box-shadow:0 4px 20px #142b4517}button{background:#194d84;color:white;border:0;border-radius:10px;padding:14px;margin:8px 4px 8px 0;font-size:16px}button:disabled{opacity:.45}#log{white-space:pre-wrap;overflow-wrap:anywhere;background:#f0f4f8;padding:12px;border-radius:10px}small{color:#5a697a}</style></head><body><main><h1>MILFT Tournois</h1><h2>Vérification Google Drive</h2><p>Page indépendante : elle ne lit ni ne modifie les tournois ou les sauvegardes existantes.</p><button id="connect" disabled>Se connecter à Google</button><button id="test" disabled>Créer une archive de diagnostic</button><button id="list" disabled>Vérifier les archives de diagnostic</button><p id="log" role="status">Initialisation…</p><small>Les fichiers de diagnostic sont conservés dans l’espace privé appDataFolder de Google Drive. Aucune restauration ni suppression n’est effectuée.</small></main><script src="https://accounts.google.com/gsi/client" async defer></script><script>
(()=>{'use strict';const CLIENT_ID='974764451814-ojqchmfb9ssca9hvmfhrgrrrirpro8ou.apps.googleusercontent.com',SCOPE='https://www.googleapis.com/auth/drive.appdata';let token='',expires=0,oauth;const $=id=>document.getElementById(id),say=t=>{$('log').textContent=t},valid=()=>token&&Date.now()<expires-60000;async function api(url,options={}){if(!valid())throw Error('Autorisation expirée : reconnectez-vous.');const r=await fetch(url,{...options,headers:{Authorization:'Bearer '+token,...options.headers}});if(!r.ok)throw Error('Google Drive HTTP '+r.status+': '+(await r.text()).slice(0,240));return r.json()}
window.addEventListener('load',()=>{if(location.origin!=='https://milft37.github.io'||!location.pathname.startsWith('/milft-tournois/')){say('Cette vérification fonctionne uniquement sur le site GitHub Pages officiel.');return}if(!window.google?.accounts?.oauth2){say('La bibliothèque de connexion Google est indisponible.');return}oauth=google.accounts.oauth2.initTokenClient({client_id:CLIENT_ID,scope:SCOPE,callback:r=>{if(r.error||!r.access_token){say('Connexion non autorisée.');return}token=r.access_token;expires=Date.now()+(Number(r.expires_in)||3600)*1000;$('test').disabled=$('list').disabled=false;say('Connecté à Google. Aucune sauvegarde de tournoi n’a été consultée.')}});$('connect').disabled=false;say('Prêt à demander la connexion Google.');});
$('connect').onclick=()=>oauth?.requestAccessToken({prompt:'consent'});
$('test').onclick=async()=>{try{say('Création du diagnostic…');const stamp=new Date().toISOString();const meta={name:'MILFT_DIAGNOSTIC_'+stamp.replace(/[:.]/g,'-')+'.json',mimeType:'application/json',parents:['appDataFolder']};const boundary='milft'+Date.now();const body='--'+boundary+'\r\nContent-Type: application/json; charset=UTF-8\r\n\r\n'+JSON.stringify(meta)+'\r\n--'+boundary+'\r\nContent-Type: application/json\r\n\r\n'+JSON.stringify({type:'MILFT_DRIVE_DIAGNOSTIC',createdAt:stamp,noTournamentData:true})+'\r\n--'+boundary+'--';const res=await api('https://www.googleapis.com/upload/drive/v3/files?uploadType=multipart&fields=id,name',{method:'POST',headers:{'Content-Type':'multipart/related; boundary='+boundary},body});say('Archive de diagnostic créée : '+res.name+'\nIdentifiant Google : '+res.id+'\nAucune donnée de tournoi modifiée.')}catch(e){say('Échec : '+e.message)}};
$('list').onclick=async()=>{try{say('Lecture des diagnostics…');const params=new URLSearchParams({spaces:'appDataFolder',q:"name contains 'MILFT_DIAGNOSTIC_' and trashed = false",fields:'nextPageToken,files(id,name,createdTime)',pageSize:'100',orderBy:'createdTime desc'});const r=await api('https://www.googleapis.com/drive/v3/files?'+params);say(r.files?.length?'Diagnostics trouvés :\n'+r.files.map(f=>f.name+' — '+f.createdTime).join('\n'):'Aucune archive de diagnostic trouvée.')}catch(e){say('Échec : '+e.message)}};
})();
</script></body></html>
